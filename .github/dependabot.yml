version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # The release workflow intentionally pins reviewed v4 action SHAs. Major
      # action upgrades need a separate compatibility review.
      - dependency-name: actions/checkout
        update-types:
          - version-update:semver-major
      - dependency-name: actions/setup-node
        update-types:
          - version-update:semver-major
